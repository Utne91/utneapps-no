<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12352f">
  <meta name="description" content="Utne Quiz – korte quizer for læring, repetisjon og nye rekorder.">
  <title>Utne Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <header class="site-header">
    <button class="brand" id="home-button" type="button" aria-label="Gå til forsiden">
      <span class="brand-mark">U</span><span>Utne Quiz</span>

    <div class="header-actions">
      <button class="header-action" id="scores-button" type="button" hidden>Highscore</button>
      <button class="header-action account-action" id="account-button" type="button" hidden></button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"><div class="empty">Starter Utne Quiz …</div></main>

  <footer>
    <span>Utne Quiz</span><span aria-hidden="true">•</span><span>Lær litt. Slå rekorden.</span>
  </footer>

  <script type="module" src="js/app.js?v=10"></script>

</html>
